<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - KinalApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f1117;
        }

        .login-card {
            background-color: #1a1d27;
            border: 1px solid #2d3148;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo h2 {
            font-size: 26px;
            font-weight: 700;
            color: #7c6af7;
            letter-spacing: 1px;
        }

        .login-logo p {
            font-size: 13px;
            color: #64748b;
            margin-top: 6px;
        }

        .login-card form {
            background: none;
            border: none;
            border-radius: 0;
            padding: 0;
            max-width: 100%;
        }

        .login-card form a {
            border: none;
            padding: 0;
            color: #7c6af7;
        }

        .login-card form a:hover {
            background: none;
            color: #a89af7;
        }

        .login-card button[type="submit"] {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            margin-right: 0;
            margin-top: 4px;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #64748b;
        }

        .login-footer a {
            color: #7c6af7;
        }

        .login-footer a:hover {
            color: #a89af7;
        }

        .error-msg {
            background-color: #2d1a1a;
            border: 1px solid #7c2d2d;
            border-left: 4px solid #e05c5c;
            color: #f87171;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <div class="login-logo">
            <h2>KinalApp</h2>
            <p>Inicia sesión para continuar</p>
        </div>

        <div class="error-msg" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/vista/login}" method="post">
            <label>Usuario</label>
            <input type="text" name="username" placeholder="Ingresa tu usuario" required/>

            <label>Contraseña</label>
            <input type="password" name="password" placeholder="Ingresa tu contraseña" required/>

            <button type="submit">Iniciar Sesión</button>
        </form>

        <div class="login-footer">
            ¿No tienes cuenta?
            <a th:href="@{/vista/registro}">Regístrate aquí</a>
        </div>

    </div>
</div>

</body>
</html>
